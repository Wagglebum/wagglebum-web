name: Sync Docs

on:
  workflow_dispatch:

# Each documentation section is copied from a private package repository into content/docs/<id>,
# and that section's Images folder into public/docs-assets/<id>/Images, which is where the docs
# renderer points relative image links. Unity .meta files are not copied.
#
# Secrets: DOCS_REPO_PAT (a token that can read every repo below), DOCS_REPO (WagSave, e.g.
# WaggleBum/wagsave-unity) and WAGSETTINGS_REPO (e.g. WaggleBum/wagsettings-unity).
#
# To add a section: check out its repo, add a "Copy" step for it, and list it in config/docs.ts.
env:
  WAGSAVE_DOCS: _wagsave/WaggleBum/WagSave/Docs
  WAGSAVE_API_DOCS: _wagsave/WaggleBum/WagSave/Core/Docs
  WAGSETTINGS_DOCS: _wagsettings/WaggleBum/WagSettings/Docs

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out wagglebum-web
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DOCS_REPO_PAT }}

      - name: Check out wagsave-unity
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DOCS_REPO }}
          token: ${{ secrets.DOCS_REPO_PAT }}
          path: _wagsave

      - name: Check out wagsettings-unity
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.WAGSETTINGS_REPO }}
          token: ${{ secrets.DOCS_REPO_PAT }}
          path: _wagsettings

      # Show the top levels of each private repo so path problems are obvious
      - name: List private repo structure
        run: find _wagsave _wagsettings -maxdepth 3 -type d | sort

      - name: Copy WagSave docs → content/docs/guide
        run: |
          mkdir -p content/docs/guide public/docs-assets/guide
          rsync -av --delete --exclude '*.meta' --exclude 'Images/' "$WAGSAVE_DOCS/" content/docs/guide/
          if [ -d "$WAGSAVE_DOCS/Images" ]; then
            rsync -av --delete --exclude '*.meta' "$WAGSAVE_DOCS/Images/" public/docs-assets/guide/Images/
          fi

      - name: Copy WagSave core docs → content/docs/api
        run: |
          mkdir -p content/docs/api
          rsync -av --delete --exclude '*.meta' "$WAGSAVE_API_DOCS/" content/docs/api/

      - name: Copy WagSettings docs → content/docs/wagsettings
        run: |
          mkdir -p content/docs/wagsettings public/docs-assets/wagsettings
          rsync -av --delete --exclude '*.meta' --exclude 'Images/' "$WAGSETTINGS_DOCS/" content/docs/wagsettings/
          if [ -d "$WAGSETTINGS_DOCS/Images" ]; then
            rsync -av --delete --exclude '*.meta' "$WAGSETTINGS_DOCS/Images/" public/docs-assets/wagsettings/Images/
          fi

      - name: Remove temporary checkouts
        run: rm -rf _wagsave _wagsettings

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ public/docs-assets/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: sync from package repos [skip ci]"
            git push
          fi
